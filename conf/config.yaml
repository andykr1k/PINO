defaults:
  - paths: default
  - hparams: default
  - _self_

project_name: pino_research

preprocess:
  num_patches: 1024
  k_neighbors: 32

# Rendered-view generation (see pino.data)
data:
  val_every: 50
  image_size: [448, 448]
  num_candidates: 24
  views_per_scene: 4
  scenes_per_batch: 3
  hfov_range_deg: [70.0, 100.0]
  height_range: [1.2, 1.8]
  pitch_range_deg: [-25.0, 10.0]
  max_splats_per_view: 150000
  max_depth: 12.0
  min_opacity: 0.005
  num_workers: 24

teacher:
  checkpoint: facebook/dinov3-vitl16-pretrain-lvd1689m
  cache_dir: null
  local_files_only: true

model:
  arch: splat_transformer  # or splatformer (PTv3 baseline, settings below)
  splatformer:
    grid_resolution: 384
    enc_dim: 64
    backbone_dim: 96
    stride: [1, 2, 2, 2]
    patch_size: 1024
    drop_path: 0.3
    head_nlayer: 4
    head_width: 128
    grad_checkpoint: true
  # SplatTransformer settings (out_dim is shared)
  num_groups: 1024
  fps_subset: 16384
  splat_dim: 128
  token_dim: 384
  depth: 8
  num_heads: 6
  out_dim: 128
  k_interp: 3

loss:
  render_weight: 1.0
  point_weight: 0.25
  render_downsample: 4
  min_alpha: 0.5
  point_max_splats: 65536
  rotate_inputs: true

train:
  device: cuda
  seed: 0
  log_every: 25
  val_every: 1000
  val_scenes: 20
  ckpt_every: 2000
  resume: null
