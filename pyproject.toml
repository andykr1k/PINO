[project]
name = "pino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aidan-lib[compiled_dino]",
    "dotenv>=0.9.9",
    "hydra-core>=1.3.2",
    "numpy>=2.4.6",
    "plyfile>=1.1.4",
    "pydantic>=2.13.4",
    "pyrefly>=1.0.0",
    "pyyaml>=6.0.3",
    "tqdm>=4.68.1",
    "viser>=1.0.30",
    "wandb>=0.27.2",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.2.0",
    "nvitop>=1.7.0",
]

[tool.uv.sources]
aidan-lib = { git = "https://github.com/Veldrovive/aidan-lib.git" }
